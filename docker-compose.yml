name: hematopass

# Este compose es EL despliegue. Corre igual en un EC2 t3.small que en un
# servidor del INSNSB — ver docs/arquitectura.md §2 y §4. Nada aquí conoce
# a AWS: sin Lambda, sin DynamoDB, sin Cognito, sin SNS.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hematopass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hematopass}
      POSTGRES_DB: ${POSTGRES_DB:-hematopass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Puerto de host no estándar (55432): en Windows, 5432 a veces está
      # reservado por el rango dinámico de Hyper-V y el bind falla. Solo
      # loopback — permite `npm run dev` local contra el mismo Postgres que
      # usa el stack en Docker, sin exponerlo en la red pública.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hematopass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servicio efímero: aplica el esquema y siembra los datos sintéticos.
  # Corre una vez por deploy y termina; `app` espera a que complete con éxito.
  migrate:
    build:
      context: .
      target: build
    command: sh -c "npx drizzle-kit push --force && npx tsx src/db/seed.ts"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hematopass}:${POSTGRES_PASSWORD:-hematopass}@postgres:5432/${POSTGRES_DB:-hematopass}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hematopass}:${POSTGRES_PASSWORD:-hematopass}@postgres:5432/${POSTGRES_DB:-hematopass}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_NAME: Hematopass
      RISK_R1_DIAS_SIN_ACTIVIDAD: ${RISK_R1_DIAS_SIN_ACTIVIDAD:-28}
      RISK_R2_HORAS_VENCIDO: ${RISK_R2_HORAS_VENCIDO:-48}
      RISK_R4_HORAS_RESULTADO_HUERFANO: ${RISK_R4_HORAS_RESULTADO_HUERFANO:-72}
      RISK_R5_HORAS_VIAJE: ${RISK_R5_HORAS_VIAJE:-48}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
